# ScratchCart — Shopify App yapılandırması
# `shopify app config link` çalıştırdıktan sonra client_id otomatik dolar.

client_id = "3e699581d10b41a3ae8db72cda4efb73"
name = "Kaz-kart-Scratch-Card-Popup"
handle = "kaz-kart-scratch-card-popup"
application_url = "https://kaz-kart-scratch-card-popup-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Yalnızca fiilen kullanılan kapsamlar istenir.
# write_discounts/read_discounts => indirim kodu üretimi ve temizliği
# read_orders => sipariş eşleştirmesi; kurtarılan sepet ve ciro raporları
#   yalnızca bununla çalışır (orders/create webhook'u). Korumalı müşteri
#   verisi kapsamıdır ve App Store incelemesinde onaya tabidir.
#
# read_products istenmiyor: kodda kullanılmıyor ve inceleme kullanılmayan
# kapsamları reddediyor.
scopes = "write_discounts,read_discounts,read_orders"

[auth]
redirect_urls = [
  "https://kaz-kart-scratch-card-popup-production.up.railway.app/auth/callback",
  "https://kaz-kart-scratch-card-popup-production.up.railway.app/auth/shopify/callback",
  "https://kaz-kart-scratch-card-popup-production.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Sipariş eşleştirmesi: kurtarılan sepet ve ciro raporlarını besler.
  # read_orders kapsamına bağlıdır.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  # --- Shopify tarafından ZORUNLU tutulan uyum (GDPR) webhook'ları ---
  # Bunlar `topics` DEĞİL `compliance_topics` altında tanımlanır. Yanlış
  # anahtarla yazıldığında Shopify deploy'u reddediyor ve hata mesajı
  # korumalı müşteri verisi onayı eksikmiş gibi okunuyor; oysa sebep
  # anahtarın kendisi. Uyum webhook'ları her uygulama için zorunludur ve
  # ayrıca bir kapsam gerektirmez.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[app_proxy]
# Mağaza tarafındaki widget bu adres üzerinden konuşur:
# https://magaza.myshopify.com/apps/scratchcart/config  ->  /proxy/config
url = "https://kaz-kart-scratch-card-popup-production.up.railway.app/proxy"
subpath = "scratchcart"
prefix = "apps"

[pos]
embedded = false
