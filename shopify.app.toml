# ScratchCart — Shopify App yapılandırması
# `shopify app config link` çalıştırdıktan sonra client_id otomatik dolar.

client_id = "3e699581d10b41a3ae8db72cda4efb73"
name = "Kaz-kart-Scratch-Card-Popup"
handle = "kaz-kart-scratch-card-popup"
application_url = "https://kaz-kart-scratch-card-popup-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# read_orders => kurtarılan siparişi eşleştirmek için (Protected customer data onayı gerekir)
# write_discounts/read_discounts => indirim kodu üretimi ve temizliği
# read_products => gelecekteki koleksiyon bazlı kurallar
scopes = "read_products,read_orders,write_discounts,read_discounts"

[auth]
redirect_urls = [
  "https://kaz-kart-scratch-card-popup-production.up.railway.app/auth/callback",
  "https://kaz-kart-scratch-card-popup-production.up.railway.app/auth/shopify/callback",
  "https://kaz-kart-scratch-card-popup-production.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # GEÇİCİ OLARAK YORUM SATIRINA ALINDI: orders/create de "protected customer
  # data" kapsamında sayılıyor ve aynı onayı gerektiriyor.
  # [[webhooks.subscriptions]]
  # topics = [ "orders/create" ]
  # uri = "/webhooks/orders/create"

  # --- Shopify tarafından ZORUNLU tutulan GDPR webhook'ları ---
  # GEÇİCİ OLARAK YORUM SATIRINA ALINDI: Partner Dashboard'da "Protected
  # customer data access" onayı alınana kadar deploy bu konularla
  # reddediliyor. Onay alındıktan sonra bu blok geri açılıp yeniden deploy
  # edilmeli (App Store başvurusundan önce zorunlu).
  # [[webhooks.subscriptions]]
  # topics = [ "customers/data_request" ]
  # uri = "/webhooks/customers/data_request"

  # [[webhooks.subscriptions]]
  # topics = [ "customers/redact" ]
  # uri = "/webhooks/customers/redact"

  # [[webhooks.subscriptions]]
  # topics = [ "shop/redact" ]
  # uri = "/webhooks/shop/redact"

[app_proxy]
# Mağaza tarafındaki widget bu adres üzerinden konuşur:
# https://magaza.myshopify.com/apps/scratchcart/config  ->  /proxy/config
url = "https://kaz-kart-scratch-card-popup-production.up.railway.app/proxy"
subpath = "scratchcart"
prefix = "apps"

[pos]
embedded = false
